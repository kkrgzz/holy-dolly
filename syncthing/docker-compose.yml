services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:1.29.7
    container_name: syncthing
    hostname: ${SYNCTHING_HOSTNAME:-homelab-sync}
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ${DATA_ROOT}/syncthing/config:/config
      # Entire HDD mounted — configure sync folders in the Syncthing web UI
      # Recommended folders to set up:
      #   /data/paperless/consume  → sync documents from phone/laptop → auto-imported by Paperless
      #   /data/media              → sync media files between devices
      - ${HDD_ROOT}:/data
