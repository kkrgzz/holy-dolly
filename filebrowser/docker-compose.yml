services:
  filebrowser:
    image: filebrowser/filebrowser:v2
    container_name: filebrowser
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "8081:80"
    volumes:
      - ${DATA_ROOT}/filebrowser/filebrowser.db:/database.db
      - ${DATA_ROOT}/filebrowser/settings.json:/.filebrowser.json
      # Browse the entire HDD from the web UI
      - ${HDD_ROOT}:/srv
