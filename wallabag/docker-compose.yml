# Wallabag — self-hosted read-it-later service
# Docs: https://doc.wallabag.org/admin/installation/installation-with-docker
#
# Default credentials: wallabag / wallabag — change immediately after first login.
# After the first successful start, set POPULATE_DATABASE to "false" and restart.
# Miniflux integration: Settings → Integrations → Wallabag in the Miniflux UI.

services:
  wallabag-db:
    image: mariadb:11.4
    container_name: wallabag-db
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: wallabag
      MYSQL_PASSWORD: ${WALLABAG_DB_PASS}
      MYSQL_DATABASE: wallabag
    volumes:
      - ${DATA_ROOT}/wallabag/db:/var/lib/mysql

  wallabag:
    image: wallabag/wallabag:2.6.14
    container_name: wallabag
    restart: unless-stopped
    depends_on:
      - wallabag-db
    ports:
      - "9091:80"
    environment:
      SYMFONY__ENV__DATABASE_DRIVER: pdo_mysql
      SYMFONY__ENV__DATABASE_HOST: wallabag-db
      SYMFONY__ENV__DATABASE_PORT: "3306"
      SYMFONY__ENV__DATABASE_NAME: wallabag
      SYMFONY__ENV__DATABASE_USER: wallabag
      SYMFONY__ENV__DATABASE_PASSWORD: ${WALLABAG_DB_PASS}
      SYMFONY__ENV__SECRET: ${WALLABAG_SECRET}
      SYMFONY__ENV__DOMAIN_NAME: https://wallabag.${DOMAIN}
      SYMFONY__ENV__FOSUSER_REGISTRATION: "false"
      # Set to "false" after the first successful start, then: make restart-wallabag
      POPULATE_DATABASE: "true"
    volumes:
      # SSD — article thumbnails and cached images
      - ${DATA_ROOT}/wallabag/images:/var/www/wallabag/web/assets/images
