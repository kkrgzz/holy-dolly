services:
  paperless-redis:
    image: redis:7.4-alpine
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/paperless/redis:/data

  paperless-db:
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASS}
    volumes:
      - ${DATA_ROOT}/paperless/pgdata:/var/lib/postgresql/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:v2.20.10
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-redis
    ports:
      - "8000:8000"
    user: "${PUID}:${PGID}"
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASS}
      USER_MAP_UID: ${PUID}
      USER_MAP_GID: ${PGID}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_URL: https://paperless.${DOMAIN}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.${DOMAIN}
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_USE_X_FORWARD_PORT: "true"
    volumes:
      # SSD — app state and full-text search index (fast I/O needed)
      - ${DATA_ROOT}/paperless/data:/usr/src/paperless/data
      # HDD — documents, exports, and incoming consume directory
      - ${HDD_ROOT}/paperless/media:/usr/src/paperless/media
      - ${HDD_ROOT}/paperless/export:/usr/src/paperless/export
      - ${HDD_ROOT}/paperless/consume:/usr/src/paperless/consume
