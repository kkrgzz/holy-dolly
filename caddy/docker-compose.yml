services:
  caddy:
    build:
      context: .
      args:
        DNS_PLUGIN: ${CADDY_DNS_PLUGIN:-porkbun}
    restart: unless-stopped
    network_mode: "host"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - TAILSCALE_IP=${TAILSCALE_IP}
      # DNS provider credentials — add/change depending on your provider
      - PORKBUN_API_KEY=${PORKBUN_API_KEY}
      - PORKBUN_API_SECRET_KEY=${PORKBUN_API_SECRET_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
